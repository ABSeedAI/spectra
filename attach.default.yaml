# `spectra attach`, distributed — the installed counterpart of attach.yaml.
#
# The one structural difference from attach.yaml (the contributors' file, which builds the runtime
# image from the working tree at `context: .`): both services build from a REMOTE GIT context pinned
# to a Spectra release, so an install needs neither a clone nor an image registry — Docker/BuildKit
# fetches the source itself. Set SPECTRA_REF to a release tag to pin it; it defaults to `main`.
#
# `install.sh` places this at ~/.config/spectra/attach.yaml, and `spectra attach` prefers that
# installed copy over the repo's attach.yaml. Everything else — the env-driven config, the mount, the
# lockdown — is identical to attach.yaml; keep the two in structural sync (they differ only in build
# context). See attach.yaml for the full reasoning.

name: spectra-attach

x-git-context: &git-context
  context: "https://github.com/ABSeedAI/spectra.git#${SPECTRA_REF:-main}"

services:
  # @coder — the sandboxed runtime, dialled out to the remote coordinator.
  coder:
    build:
      <<: *git-context
      dockerfile: Dockerfile.runtime
    container_name: spectra-attach-coder
    volumes:
      - ${ATTACH_PROJECT_DIR:-./app}:/work/project
    environment:
      - NODE_ENV=production
      - MODE=attach
      - AGENT=coder
      - COORDINATOR_URL=${COORDINATOR_URL}
      - SERVER_URL=${SERVER_URL}
      - DEVICE_TOKEN=${DEVICE_TOKEN}
      - ORG=${ORG:-local}
      - PROJECT_ID=${PROJECT_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Optional git push credential (a user PAT in spectra.env) so local @coder can push — forge-neutral,
      # fed to a git credential helper by the runtime. Absent → local commits work, pushes unauthenticated.
      - GIT_TOKEN=${GIT_TOKEN:-}
      - GIT_USERNAME=${GIT_USERNAME:-}
    mem_limit: 2g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # @spec — same image, AGENT=spec, no filesystem tools and no mount.
  spec:
    build:
      <<: *git-context
      dockerfile: Dockerfile.runtime
    container_name: spectra-attach-spec
    environment:
      - NODE_ENV=production
      - MODE=attach
      - AGENT=spec
      - COORDINATOR_URL=${COORDINATOR_URL}
      - SERVER_URL=${SERVER_URL}
      - DEVICE_TOKEN=${DEVICE_TOKEN}
      - ORG=${ORG:-local}
      - PROJECT_ID=${PROJECT_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    mem_limit: 2g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
